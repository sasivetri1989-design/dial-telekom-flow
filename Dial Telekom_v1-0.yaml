inboundCall:
  name: Dial Telekom
  description: "Dial Telekom inbound call flow"
  division: Home
  startUpRef: "/inboundCall/tasks/task[Default Task]"
  defaultLanguage: en-us
  supportedLanguages:
    en-us:
      defaultLanguageSkill:
        lit:
          name: English
      textToSpeech:
        Genesys Enhanced TTS:
          voice: en-US-JennyNeural
  initialGreeting:
    tts: Thank you for calling Telekom. Please hold while we connect you.
  settingsActionDefaults:
    playAudioOnSilence:
      allowedRepeatCount:
        lit: 5
      silenceDuration:
        lit:
          seconds: 1
      timeout:
        lit:
          seconds: 40
    detectSilence:
      silenceDuration:
        lit:
          seconds: 1
      timeout:
        lit:
          seconds: 40
  tasks:
    task:
      name: Default Task
      actions:
        - disconnect:
            name: Disconnect

inboundCall:
  name: Dial Telekom
  description: "Dial Telekom inbound call flow"
  division: Home
  startUpRef: "/inboundCall/tasks/task[DialTelekom_Task_1]"
  defaultLanguage: en-us
  supportedLanguages:
    en-us:
      defaultLanguageSkill:
        lit:
          name: English
      textToSpeech:
        Genesys Enhanced TTS:
          voice: en-US-JennyNeural
  initialGreeting:
    tts: Thank you for calling Telekom. Please hold while we connect you.
  settingsActionDefaults:
    playAudioOnSilence:
      allowedRepeatCount:
        lit: 5
      silenceDuration:
        lit:
          seconds: 1
      timeout:
        lit:
          seconds: 40
    detectSilence:
      silenceDuration:
        lit:
          seconds: 1
      timeout:
        lit:
          seconds: 40
    callData:
      processingPrompt:
        noValue: true
    collectInput:
      interDigitTimeout:
        lit:
          seconds: 3
      noEntryTimeout:
        lit:
          seconds: 5
    transferToUser:
      connectTimeout:
        noValue: true
    transferToNumber:
      connectTimeout:
        noValue: true
    transferToGroup:
      connectTimeout:
        noValue: true
  settingsErrorHandling:
    errorHandling:
      disconnect:
        none: true
    preHandlingAudio:
      tts: Sorry, an error occurred. Please try your call again.
  settingsPrompts:
    ensureAudioInPrompts: false
    promptMediaToValidate:
      - mediaType: audio
      - mediaType: tts
  tasks:
    - task:
        name: Dial Telekom Main
        refId: DialTelekom_Task_1
        actions:
          - disconnect:
              name: Disconnect
